plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.bjornvester.xjc' version '1.9.1'
}

group = 'de.consorsbank'
version = '0.0.1-SNAPSHOT'

// ─────────────────────────────────────────────────────────────────────────────
// Java 21 Toolchain
// Spring Boot 4.0.8 requires Java 17+ and supports up through Java 26.
// A toolchain (rather than sourceCompatibility/targetCompatibility) makes
// Gradle download and use JDK 21 even if the host JVM is different.
// ─────────────────────────────────────────────────────────────────────────────
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// ─────────────────────────────────────────────────────────────────────────────
// JAXB dependencies (versions managed by the Spring Boot 4.0.8 BOM):
//   jakarta.xml.bind-api     4.0.5  → Jakarta XML Binding API (Jakarta EE 10).
//   jakarta.activation-api   2.1.4  → companion Activation API required by JAXB.
//   org.glassfish.jaxb
//     jaxb-runtime           4.0.9  → JAXB RI (Eclipse Implementation of JAXB).
//     jaxb-xjc               4.0.9  → XJC compiler, isolated by the XJC plugin.
//
// We omit explicit versions on these artifacts so the Boot BOM stays the
// single source of truth. Pinning by hand would drift from 4.0.8's aligned set.
//
// WHY NOT jaxb-api (com.sun.xml.bind:jaxb-api / javax.xml.bind:jaxb-api)?
//   Those artifacts belong to the old javax.xml.bind namespace (JAXB 2.x).
//   Mixing them with jakarta.xml.bind (JAXB 4.x) causes incompatible types.
//
// WHY NOT EclipseLink MOXy?
//   MOXy is a different JAXB provider (org.eclipse.persistence:org.eclipse.persistence.moxy).
//   This POC uses the GlassFish / Eclipse EE4J JAXB RI.
// ─────────────────────────────────────────────────────────────────────────────
dependencies {
    // ── Application runtime ──────────────────────────────────────────────────
    // Boot 4 deprecates spring-boot-starter-web in favor of -webmvc.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Jakarta JAXB API so application + generated sources can use
    // @XmlRootElement, JAXBContext, etc. Version comes from the Boot BOM.
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api'

    // JAXB RI implementation (not on the compile classpath).
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime'

    // Boot 4 test starters are technology-specific; -webmvc-test brings
    // spring-boot-starter-test transitively (JUnit 5, AssertJ, MockMvc).
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

}

// The XJC Gradle plugin owns the generator task, generated-source output,
// and its dependency on Java compilation. XJC receives the standalone XSD;
// it generates JAXB model classes, not SOAP client proxies.
xjc {
    xsdDir.set(layout.projectDirectory.dir('wsdl'))
    includes.set(['ESBTransactionAuthorization_v1_0.xsd'])
    outputJavaDir.set(layout.buildDirectory.dir('generated-sources/jaxb'))
    useJakarta.set(true)
    xjcVersion.set('4.0.9')
    defaultPackage.set('de.consorsbank.consumingwebservice.wsdl')
    addCompilationDependencies.set(false) // JAXB API is managed below by Boot's BOM.
    options.add('-extension')
}

// Keep the familiar project task name for local scripts and documentation.
tasks.register('genJaxb') {
    group = 'code generation'
    description = 'Generate JAXB sources from the ESB authorization XSD.'
    dependsOn tasks.named('xjc')
}
